<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模型轉發</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>模型轉發</h1>
    <section aria-label="轉發狀態">
      <p id="status" role="status" aria-live="polite">正在讀取狀態…</p>
      <p id="detail" hidden></p>
      <div class="actions">
        <button id="on" type="button" disabled>啟用轉發</button>
        <button id="off" type="button" disabled>停用並復原</button>
        <button id="refresh" type="button">重新整理</button>
      </div>
      <p id="error" role="alert" hidden></p>
    </section>
    <p class="note">切換後請重開 Claude Code。啟用時可輸入 <code>/provider</code> 切換當前對話的模型。</p>
  </main>
</body>
</html>
